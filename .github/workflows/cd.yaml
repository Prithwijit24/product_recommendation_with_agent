name: Deploy to Hugging Face Space

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ghoshprithwijit39@gmail.com"
          git config --global user.name "Prithwijit24"

          # Clone the Space with the token embedded so push works later
          git clone https://Prithwijit24:${HF_TOKEN}@huggingface.co/spaces/Prithwijit24/product_reco_deploy hf_space

          # Copy everything from the current repo into the Space repo
          rsync -av --exclude='.git' --exclude='hf_space' --exclude='.github' ./ hf_space/

          cd hf_space
          git add .
          git commit -m "Auto-deploy from GitHub Actions" || echo "No changes to commit"
          git push
name: Deploy to Hugging Face Space

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check HF_TOKEN is set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_TOKEN secret is empty or not set."
            echo "Go to GitHub repo → Settings → Secrets and variables → Actions and add HF_TOKEN."
            exit 1
          else
            echo "✅ HF_TOKEN is set (length: ${#HF_TOKEN} characters)"
          fi

      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub[cli]"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload Prithwijit24/product_reco_deploy . . \
            --repo-type=space \
            --token="$HF_TOKEN" \
            --commit-message="Auto-deploy from GitHub Actions"
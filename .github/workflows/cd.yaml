name: Deploy to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check HF_ACCESS_TOKEN is set
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: |
          if [ -z "$HF_ACCESS_TOKEN" ]; then
            echo "❌ HF_ACCESS_TOKEN secret is empty or not set."
            echo "Go to GitHub repo → Settings → Secrets and variables → Actions and add HF_ACCESS_TOKEN."
            exit 1
          else
            echo "✅ HF_ACCESS_TOKEN is set (length: ${#HF_ACCESS_TOKEN} characters)"
          fi

      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub[cli]"

      - name: Push to Hugging Face Space
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: |
          hf upload Prithwijit24/product_reco_deploy . . \
            --repo-type=space \
            --token="$HF_ACCESS_TOKEN" \
            --commit-message="Auto-deploy from GitHub Actions"
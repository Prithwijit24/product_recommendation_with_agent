name: Deploy to Hugging Face Space

on:
  # push:
  #   branches:
  #     - deploy_branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ghoshprithwijit39@gmail.com"
          git config --global user.name "Prithwijit24"

          git clone https://huggingface.co/spaces/Prithwijit24/product_reco_deploy
          cd product_reco_deploy

          git add .
          git commit -m "Auto-deploy from GitHub Actions" || echo "No changes"
          git push


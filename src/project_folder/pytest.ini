[pytest]
# Pytest configuration for product recommendation system tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Test paths
testpaths = .

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for workflows
    slow: Slow running tests
    mock: Tests using mocking
    performance: Performance benchmarks
    error_handling: Error handling tests
    data_validation: Data validation tests

# Coverage options (when running with pytest-cov)
# pytest --cov=recommendation_agent --cov=scripts --cov-report=html

# Logging
log_cli = false
log_level = INFO
